# 全ストラテジー共通の監視銘柄リスト
# ここを編集すれば、全ストラテジー（small_lot_sell_detector / panic_sell_detector /
# under_surge_detector / AIStrategys / edinet_holder_monitor / periodic_buy_rss）に反映される。
#
# 注意:
#   - kabuステーションAPIのPUSH配信の銘柄登録上限は50銘柄（アプリ全体で共有）。
