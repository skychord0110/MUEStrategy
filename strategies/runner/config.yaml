# 統合ランナー設定
# APIパスワードは環境変数 KABU_API_PASSWORD から読み込みます（このファイルには書きません）。
# "production" (本番環境・ポート18080) または "demo" (検証環境・ポート18081)
# 注意: 検証環境は発注テスト専用で、銘柄登録は空が返りPUSH配信も流れない。
environment: production

# 監視銘柄は全ストラテジー共通の外部ファイルで管理する（このconfigからの相対パス）。
# 銘柄の追加・入れ替えは ../symbols.yaml を編集する。
# このファイルに symbols: を直接書いた場合はそちらが優先される（単一銘柄でのテスト用）。
symbols_file: ../symbols.yaml

# デバッグ: 起動直後N件のPUSH生データをそのままログ出力する
debug_raw_messages: 20

# ── 各ストラテジーの有効/無効と閾値 ──
# enabled: false にすればそのストラテジーだけ止められる（他は動き続ける）
strategies:

  # 小口売り連続検知（気配にぶつかる小口売りがN回連続 → 需給改善の兆し）
  small_lot_sell_detector:
    enabled: true
    small_lot_threshold: 300      # この株数以下を「小口」とみなす
    price_tolerance_ticks: 0      # 最良買い気配との価格差の許容ティック数
    min_hit_interval_seconds: 1.0 # アルゴ分散売り対策: この秒数未満で連射される小口売りはカウントしない
    alert_tiers:
      - consecutive: 5
        label: "WATCH"
      - consecutive: 10
        label: "STRONG"

  # 投げ売り検知（安値圏でOVER急減 → ほぼ同数が売り直し/ぶつけで降りてくる）
  panic_sell_detector:
    enabled: true
    over_drop_threshold: 3000      # OVER小銘柄向け: この株数以上の減少でイベント
    large_over_threshold: 100000   # この株数を超えるOVERを持つ銘柄は割合判定に切り替え
    large_over_drop_pct: 0.10      # OVER大銘柄向け: 直前のOVERの10%以上の減少でイベント
    match_tolerance: 0.2           # 「ほぼ同数」の許容誤差（80%以上で成立）
    match_window_seconds: 30       # イベント発生後の監視時間窓
    low_zone_pct: 0.007            # 当日安値からこの割合以内を「安値圏」とする
    requote_levels: 3              # 「売り気配周辺」とみなす板の本数
    requote_consumed_fraction: 0.5 # ABSORBED通知に必要な消化割合
    price_tolerance_ticks: 0

  # UNDER急増検知（安値圏でUNDERが一気に増加・OVERほぼ不変 → 下値に大口買い）
  under_surge_detector:
    enabled: true
    under_increase_pct: 0.20        # UNDER急増とみなす1更新あたりの増加割合
    over_change_tolerance_pct: 0.05 # 「OVERほぼ不変」の許容変化割合
    low_zone_pct: 0.01              # 当日安値からこの割合以内を「安値圏」とする
    cooldown_seconds: 60            # 同一銘柄の連続通知の抑制間隔（秒）
    quiet_windows:                  # 板寄せ直後の通知抑制時間帯
      - "09:00-09:01"
      - "12:30-12:31"

  # ── AIストラテジー（仮想売買・発注なし。詳細: ../AIStrategys/README.md） ──
  # 2026-07-13〜17のログ分析（analysis/）に基づく買い戦略のフォワード検証用。

  # 午後の下値大口買い検知・引け戻り（13時以降のUNDER急増で仮想買い→SL/TP/大引け）
  afternoon_reversal:
    enabled: true
    entry_start: "13:00"   # 仮想エントリーを許可する開始時刻
    entry_end: "15:00"     # これ以降は新規エントリーしない
    stop_loss_pct: 2.0     # 損切り幅（%）
    take_profit_pct: 2.0   # 利確幅（%）
    min_entry_price: 500.0 # この価格未満の銘柄はエントリーしない（低位株はノイズが大きく
                           # 勝率が落ちるため。0でフィルタ無効。詳細: ../AIStrategys/README.md）

  # 投げ売り反発（セリクラ検知→仮想買い）。終日が対象で時間帯を絞らない
  # 検証: n=12・勝率66.7%・期待値+0.678%（SL1%/TP2%）だが week1 はマイナス。
  # サンプルが極小のためフォワード検証が目的。詳細: ../AIStrategys/README.md
  panic_rebound:
    enabled: true
    entry_start: "09:00"   # 投げ売りは寄り付き直後にも起こるため終日を対象にする
    entry_end: "15:00"
    stop_loss_pct: 1.0     # 損切り幅（%）。浅めに置き、伸びる時だけ取る設計
    take_profit_pct: 2.0   # 利確幅（%）。リスクリワード1:2
    min_entry_price: 0.0   # 価格下限（0=無効）。低位株でも機能したため既定は無効
    stages: ["DUMP"]       # 対象の段階。DUMP=買い気配へぶつけ / ABSORBED=投げ売り吸収

  # 投げ売り反発・幅広版（上の panic_rebound と検知は同じ。損切り・利確の幅だけが違う）
  # 2026-08-14の5週間分析より、同一銘柄1日1回に整理した n=20 での比較:
  #   SL-1.0%/TP+1.0%  勝率80.0% 期待値+0.594% コスト後+0.444%
  #   SL-1.5%/TP+3.0%  勝率70.0% 期待値+1.242% コスト後+1.092%  ← こちら
  #   SL-2.0%/TP+2.0%  勝率75.0% 期待値+0.826% コスト後+0.676%
  # 最大益の中央値+2.02%に対し最大損の中央値-0.87%。利確が早く損切りが浅いという読み。
  # 勝率は落ちるが期待値は倍。どちらが実際に効くかを並走させて比べる。
  # ※n=20と少なく、week1はマイナス。仮想売買のみで実発注の対象にはしていない。
  # 詳細: ../../analysis/analysis_result_2026-08-14.md
  panic_rebound_wide:
    enabled: true
    entry_start: "09:00"   # 20件中18件が午前に出ているため終日を対象にする
    entry_end: "15:00"
    stop_loss_pct: 1.5     # 損切り幅（%）
    take_profit_pct: 3.0   # 利確幅（%）。リスクリワード1:2
    min_entry_price: 0.0
    stages: ["DUMP"]

  # 複合シグナル（午後に30分以内でUNDER急増と小口売り連続が両方点灯→仮想買い）
  confluence:
    enabled: true
    window_seconds: 1800   # UNDER急増と小口売り連続がこの秒数以内に両方揃ったら発火
    entry_start: "13:00"
    entry_end: "15:00"
    stop_loss_pct: 1.0
    take_profit_pct: 1.0

# ── EDINET大量保有報告書モニタ（別系統・バックグラウンド実行） ──
# 大口保有者の売却進捗を追い、売り切りタイミングを通知する日次バッチを
# ランナー起動時にバックグラウンドで開始する（PUSH処理はブロックしない）。
# 要: 環境変数 EDINET_API_KEY（未設定ならスキップされる）
# 詳細: ../edinet_holder_monitor/README.md
edinet_holder_monitor:
  enabled: true
  interval_hours: 24    # チェック間隔（起動時に1回 → 以降この間隔で繰り返す）
  days: 30              # 起動直後のチェックで遡る日数（2回目以降は前回チェック日から）
  config_path: null     # モニタ側のconfig。null=../edinet_holder_monitor/config.yaml

# ── 定期買い集め検知（旧・生カウント方式）──
# z値方式(periodic_buy_zscore)に置き換えたため既定は無効。
# 生の「10秒差ペア数」で判定するため流動性の高い銘柄でノイズが多い。
# 比較検証したいときだけ true にする（併用すると通知が重複する）。
# 詳細: ../periodic_buy_rss/README.md
periodic_buy_rss:
  enabled: false
  connect_retry_seconds: 60   # Excel未起動時の再試行間隔（秒）
  max_connect_retries: 10     # 再試行回数。既定は10分ぶん待ってから諦める
  config_path: null           # ツール側のconfig。null=../periodic_buy_rss/config.yaml

# ── 定期買い集め検知（z値方式・現行）──
# 「約定のちょうど10秒後の買い」が他のラグ(6〜14秒)と比べて統計的に突出している銘柄を通知。
# kabuステーションAPIの歩み値を使うためExcel・マーケットスピードIIは不要。
# 詳細: ../periodic_buy_zscore/README.md
periodic_buy_zscore:
  enabled: true
  config_path: null     # ツール側のconfig。null=../periodic_buy_zscore/config.yaml

# ── 口座スナップショット（コントロールパネル表示用）──
# 買付余力・建玉・評価損益を定期的に state/account.json に書き出す。
# コントロールパネルはこのファイルを読むだけで、自分ではAPIトークンを発行しない。
# （トークンは「別のトークンが新たに発行された時」に無効になるため、
#   UIが独自に認証するとランナー側の発注が失敗しうる。詳細: src/account_snapshot.py）
account_snapshot:
  enabled: true
  interval_seconds: 15  # 更新間隔（秒）。参照系2本だけなのでレート制限には余裕がある
