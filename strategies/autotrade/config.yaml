# ============================================================================
# 自動売買設定 — このファイルの設定で「実際の資金」が動きます
# ============================================================================
# 変更前に必ず内容を確認すること。特に enabled / strategies / capital は
# 誤設定がそのまま損失につながります。
#
# 安全設計:
#   - enabled: false の間は、判定・ログのみで発注APIを一切呼びません
#   - strategies が全て false なら、enabled: true でも発注しません
#   - dry_run: true なら、発注内容をログに出すだけで実際には送信しません
# ============================================================================

# ── 全体の安全スイッチ ──
# false の間は一切発注しない。実運用を始めるときだけ true にする。
enabled: true

# true の場合、発注の代わりに「送信予定の注文内容」をログ出力する（動作確認用）。
# 実弾を動かす前に必ず dry_run: true で1日流して、注文内容が意図どおりか確認すること。
dry_run: false

# ── どの戦略を実際の売買に使うか ──
# false の戦略は従来どおり仮想売買（ログのみ）を続ける。
# 実績が固まった戦略だけ true にする運用を推奨。
# コントロールパネル（ui/）の「実売買に使う戦略」から切り替えられる。
strategies:
  # 午後の下値大口買い→引け戻り
  # 実績: 実稼働46取引 勝率73.3% 期待値+0.652%/回（2026-07-21〜08-07）
  afternoon_reversal: false

  # 午後の下値大口買い→引け戻り・順位優先版
  # 銘柄リスト上位25位は即エントリー、それ以下は14時以降のみ。
  # 検証: 1日1建玉の実測（21営業日・コスト後）で
  #   現行 21回 勝率76.2% +0.633%/回 累計+13.29% 負け3回(最悪-2.00%)
  #   本版 18回 勝率94.4% +0.708%/回 累計+12.74% 負け1回(最悪-1.18%)
  # 累計はほぼ同じで、負けを3回→1回に減らせる。ただし上位25位の標本は n=32 と少ない。
  afternoon_reversal_ranked: true

  # 投げ売り反発（セリングクライマックス）
  # 実績: 実稼働4取引のみ。サンプル不足のため検証段階
  panic_rebound: false

  # 複合シグナル（UNDER急増＋小口売り連続）
  # 実績: 実稼働14取引 勝率57.1% 期待値+0.224%/回。エッジは小さい
  confluence: false

  # 定期買い集め検知（楽天RSS・歩み値ベース）
  # 実績: 売買シグナルとしては未検証。WATCHはノイズが多い
  # ※現状この項目は効かない。自動売買が発注するのはAI戦略（上の3つ）の
  #   ENTRYシグナルを受けたときだけで、定期買い集め検知は通知しか出さないため。
  #   売買に使うには、まずAI戦略としてエントリー条件を実装する必要がある。
  #   （コントロールパネルにこの項目を出していないのはこのため）
  periodic_buy_rss: false

# ── 資金管理 ──
capital:
  # 口座区分: "cash"=現物 / "margin"=信用
  # 現在の戦略はすべて「買いから入る」ため現物。
  # 将来「売りから入る」戦略を実装する場合はその戦略のみ margin（信用）にする。
  product: "cash"

  # このシステムが使ってよい上限金額（円）。
  # 残高を参照し、この金額を超えない範囲で発注数量を決める。
  max_use_amount: 80000

  # 1銘柄あたりの上限金額（円）。max_use_amount 以下で指定する。
  # 同時に複数銘柄を持つ場合の1銘柄あたりの配分。
  max_amount_per_symbol: 80000

  # 同時に保有してよい建玉数の上限
  max_positions: 1

  # 単元株数。数量は「単元の倍数」に切り捨てて発注する
  # 例: 上限30万円・株価700円 → 428株 → 400株（4単元）で発注
  lot_size: 100

  # 残高照会の結果がこの金額を下回っていたら新規発注しない（安全弁）
  min_free_margin: 20000

  # 口座種別（/sendorder の AccountType）: 2=一般 / 4=特定 / 12=法人
  # ※ご自身の口座に合わせること。誤ると発注が弾かれる
  account_type: 4

# ── エントリー（新規建て）──
entry:
  # 新規建ての注文種別
  #   "market"       = 成行。確実に約定するが、板が薄いと滑る
  #   "limit_signal" = シグナル価格（検知時の現在値）に指値
  # ※綴りを間違えると発注を中止する（黙って成行に落とすと意図しない価格で
  #   約定するため）。ログに「entry.order_type の指定が不正です」と出る。
  order_type: "limit_signal"

  # シグナル価格から何ティックずらして指すか。
  #   0  = シグナル価格ちょうど（既定）
  #   +1 = 1ティック上＝約定しやすいが高く買う
  #   -1 = 1ティック下＝有利だが約定しにくい
  # 呼値に乗らない端数は必ず切り下げる（指値は「これより上では買わない」上限）。
  limit_offset_ticks: 0

  # 未約定の指値をこの時刻までに取り消す（null で取り消さない）。
  # 出しっぱなしにすると 15:25〜15:30 のクロージング・オークションで約定し、
  # 決済されないまま翌日に持ち越す恐れがあるため。
  # 日中で完結させる戦略なので、close_out.deadline と揃えている。
  cancel_unfilled_at: "15:25"

# 【未約定のあいだの扱い】
#   ・指値が約定するまで建玉は存在しないので、反対売買・損切り・引け際の
#     手仕舞いはいずれも発注されない（PositionManager が作られないため）。
#   ・指値を残したまま別銘柄のシグナルが出た場合:
#       その銘柄がすぐ約定する（シグナル価格 >= 売り気配）なら乗り換える
#       （出している指値を取り消して、新しい銘柄にぶつけに行く）
#       すぐ約定しないなら、いまの指値をそのまま残して新しいシグナルは見送る
#     資金が1銘柄ぶんしかないため、未約定の指値は常に1件までとする。

# ── 利益確定（反対売買）──
# 【重要】建玉と同時に決済注文を出さない。
# 他者のアルゴに手の内を読まれるのを避けるため、目標価格に近づいてから発注する。
take_profit:
  # 目標価格（利確ライン）。各戦略の take_profit_pct を使う場合は null
  # ここで上書きしたい場合のみ数値を入れる
  pct: null

  # 「気配が目標価格からこのティック数以内に近づいたら」決済注文を出す。
  # 買い建玉なら 売り気配(Ask) が 目標価格−Nティック 以上に接近した時点。
  reveal_within_ticks: 2

  # 発注する注文種別: "limit_target"=目標価格に指値
  order_type: "limit_target"

# ── 損切り ──
# 【前提】ここは「損切りトリガーが発動した後」の執行手順。
#   トリガー価格 = エントリー価格 × (1 − stop_loss_pct/100)
#   現在値がトリガー価格に達した時点で発動し、以下(A)(B)のいずれかで決済しにいく。
#   建玉と同時に決済注文は出さない（他者のアルゴに手の内を読まれないため）。
stop_loss:
  # 損切りライン(%)。各戦略の stop_loss_pct を使う場合は null
  pct: null

  # (A) 発動時、買い気配がトリガー価格の1ティック以内にある場合:
  #     → 買い気配にそのまま指値をぶつけて即約定を狙う。
  #     注文が間に合わず気配が下がった場合は、同じ条件で買い気配に指し直す。
  hit_bid_within_ticks: 1

  # (B) 発動時、買い気配がトリガー価格より1ティックを超えて下にある場合:
  #     → 仲値（(買い気配+売り気配)/2）に売り指値を出す。
  #     mid_price_retry_seconds ごとに mid_price_step_ticks ずつ下げて指し直し、
  #     約定するまで繰り返す。
  mid_price_retry_seconds: 10       # 何秒待って約定しなければ指し直すか
  mid_price_step_ticks: 1           # 1回の指し直しごとに下げるティック数
  mid_price_rounding: "down"        # 仲値が呼値に乗らない場合は不利側(売りなら切り下げ)に丸める

  # 【追いかけの下限】これ以上は価格を下げて追わない。
  # 下限価格 = エントリー価格 × (1 − max_chase_pct_from_entry/100)
  # 下限に到達したら、それ以上下げずに同じ価格で指し直し続ける。
  # （それでも約定しなければ close_out の強制手仕舞いに引き継がれる）
  max_chase_pct_from_entry: 3.0

# ── 引け際の手仕舞い（日中で完結させる戦略）──
close_out:
  # この時刻までに決済が約定しなければ、強制手仕舞いに移行する
  deadline: "15:25"

  # 強制手仕舞いの発注時刻
  force_time: "15:26"

  # 強制手仕舞いの注文種別
  #   "aggressive_limit" = 気配を貫く指値（下記 ticks 分）
  #   "moc"              = 引成（FrontOrderType 16）。価格指定なし
  # 東証は 15:25〜15:30 がクロージング・オークション（板寄せ）のため、
  # この時間に出した指値は即約定せず、大引けの単一価格で約定する。
  # したがって aggressive_limit は「価格上限付きの引成」として機能する。
  order_type: "aggressive_limit"

  # aggressive_limit のとき、気配から何%貫くか
  # 買い建玉の決済(売り)なら「買い気配 × (1 − aggression_pct/100)」。呼値の刻みに切り下げる。
  # ティック数ではなく率で指定する理由:
  #   同じ「10ティック」でも実質の深さが銘柄でまるで違う（318円の銘柄で-3.1%、
  #   2740円の銘柄で-0.36%）。浅いと板寄せで約定しない恐れがあり、
  #   「確実に手仕舞う」という目的に反するため率で揃える。
  aggression_pct: 3.0

# ── 発注の安全弁 ──
safety:
  # 1日あたりの最大発注回数（暴走時のブレーキ）
  max_orders_per_day: 20

  # 同一銘柄への1日あたり最大エントリー回数
  max_entries_per_symbol_per_day: 1

  # 発注間隔の最小秒数（連射防止）
  min_order_interval_seconds: 3

  # 想定外の状態（建玉と注文の不整合など）を検知したら新規発注を止める
  halt_on_inconsistency: true
