# 定期買い集め検知（z値方式）の設定
# 「約定のちょうど10秒後に買い」が他のラグと比べて統計的に突出している銘柄を通知する。
# データ源は kabuステーションAPI の歩み値（GET /timeandsales）。Excelは不要。

# 監視銘柄は全ストラテジー共通の外部ファイルを使う
symbols_file: ../symbols.yaml

exchange: 1                    # 市場コード（1=東証）

# ── ポーリング ──
poll_interval_seconds: 1.0     # 1銘柄あたりの取得間隔（秒）。50銘柄なら1周およそ50秒
                               # レート制限(429)が出るなら長くする。
                               # 毎回その日の全件が返るため、間隔を空けても取りこぼしはない
session_start: "09:00"         # 検知対象の開始時刻
session_end: "15:30"           # 検知対象の終了時刻
idle_poll_seconds: 30          # 時間外に時刻だけ確認する間隔（秒）
summary_interval_minutes: 30   # z値ランキングをログに出す間隔（分）。0で無効

# ── 検知条件 ──
detector:
  delay_seconds: 10.0          # 狙うラグ（この秒数後の買いを数える）

  # 比較に使うラグの範囲。この範囲の各ラグのペア数を並べ、
  # delay_seconds だけが突出しているかを z値 で測る
  lag_min: 6
  lag_max: 14

  # 通知のしきい値。2026-08-10の実データでは:
  #   4013(勤次郎) z=+15.10 ★  他5銘柄は -1.36 〜 +1.56
  # だったため、z>=5 なら誤検知ゼロで勤次郎だけを拾えた
  z_threshold: 5.0             # WATCH
  strong_z_threshold: 10.0     # STRONG

  # 母数が小さいときの誤検知防止
  min_trades: 50               # 当日の約定がこれ未満の銘柄は判定しない
  min_pairs: 20                # 該当ペアがこれ未満なら通知しない

  # 「10秒後の約定」のうち買い上がり＋同値が占める割合の下限（0で無効）
  # 勤次郎は0.89だった。0.6程度にすると売り方向のノイズを除ける
  min_buy_ratio: 0.0
